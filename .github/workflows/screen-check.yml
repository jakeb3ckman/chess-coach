# Manual check: deep-analyze every one of my moves in a sample of games and
# count the mistakes the pass-1 screen misses. Writes nothing to the repo.
name: screen-check

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "How many games to deep-check"
        default: "30"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .engine
          key: stockfish-${{ runner.os }}-${{ hashFiles('tools/stockfish.lock') }}
      - run: tools/install_stockfish.sh
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.5"
      - run: uv sync --frozen
      - run: uv run python -m coach versions
      - run: uv run python scripts/screen_miss_check.py --sample "${{ inputs.sample }}" --workers "$(nproc)" --out tmp/screen-check.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: screen-check
          path: tmp/screen-check.json
