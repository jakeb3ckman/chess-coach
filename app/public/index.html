<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<!-- maximum-scale=1: stops iOS zooming the page in when a text box is tapped. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#262421">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- "black": an opaque status bar with the app below it. "black-translucent" drew the
     app underneath the status bar, where iOS blurs it. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Chess Coach">
<title>Chess Coach</title>
<meta name="app-version" content="__VERSION__">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="app.css?v=__BUILD_ID__">
</head>
<body>
<div id="app">
  <header id="bar"><button id="menu" aria-label="Settings">⚙︎</button></header>
  <div id="hint" hidden></div>
  <div id="syncmsg" hidden></div>
  <main id="board-wrap"><div id="board"></div></main>
  <div id="counts"></div>
  <div id="banner" class="prompt" aria-live="polite">Loading…</div>
  <section id="panel"><div id="info"></div><div id="actions"></div></section>
</div>
<div id="promo" hidden></div>
<dialog id="settings"></dialog>
<script type="module" src="app.js?v=__BUILD_ID__"></script>
</body>
</html>
