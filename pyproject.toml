[project]
name = "chess-coach"
version = "0.1.0"
description = "Personal chess trainer built from my own games (pipeline)"
requires-python = "==3.12.13"
dependencies = [
    "chess==1.11.2",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
