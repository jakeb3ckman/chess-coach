# Personal Chess Coach settings.
# Card rules can be changed at any time: cards are rebuilt from stored analysis.
# Engine settings only apply to games analyzed after the change (finished games are never re-analyzed).

[accounts]
chesscom = "jakeb3ckman"
lichess = "jbeck1026"

[import]
time_classes = ["bullet", "blitz", "rapid"]   # standard chess only; daily/correspondence/variants are skipped
user_agent = "chess-coach-personal/1.0 (username: jakeb3ckman)"

[engine]
threads = 1                 # 1 thread + fixed nodes = repeatable results on any machine
hash_mb = 16
pass1_nodes = 200000        # every position
pass2_nodes = 2000000       # candidate moves only
pass2_multipv = 2
candidate_min_drop = 7.0    # Win% points lost in pass 1 to get a deep check
candidate_min_win_before = 5.0  # skip deep checks when already below this Win%
pv1_min_drop = 5.0          # keep the pass-1 engine line for my moves that lost at least this much
pv_max_plies = 10

[labels]                    # drop in Win% points (0-100 scale), same as Lichess
inaccuracy = 5.0
mistake = 10.0
blunder = 15.0

[cards]
min_label = "mistake"       # mistake or blunder
min_second_best_gap = 15.0  # best move must beat the 2nd-best by this many Win% points
decided_low = 10.0          # below this Win% before the move = already lost
decided_high = 90.0         # above this = already won ...
thrown_win_below = 50.0     # ... unless the move dropped me below this (thrown-away win stays eligible)
time_trouble_max_s = 15.0   # severe time trouble = clock before the move < min(max_s, frac * base time)
time_trouble_frac = 0.10
new_per_day = 10

[analysis_jobs]
batch_games = 20            # commit after this many finished games
budget_minutes = 300        # stop starting new games after this long (GitHub's job limit is 360)

[positions]                 # the position pass (Phase 3): deep multi-line search of repeated opening positions
min_games = 3               # position reached in at least this many of my games
max_ply = 30                # within my first 15 moves
nodes = 5000000             # per search, 1 thread, hash cleared
multipv = 5
min_played_for_extra = 2    # also search each move I played this often that isn't in the top 5
pv_max_plies = 10
commit_every = 100          # searches per commit

[openings]
group_min_games = 10        # a variation needs this many games to be its own row
tree_min_games = 3          # positions shown in the move tree
engine_top_min_games = 10   # show the engine's top 3 where a position was reached this often
leak_min_drop = 5.0         # Win% lost: a leak (report)
leak_error_drop = 10.0      # Win% lost: an error (leak card); below = repertoire choice
right_within = 2.0          # leak cards: a move within this many Win% of the best is right
playable_within = 5.0       # ... within this many: "playable, but there's better"
leak_cards_per_day = 3      # at most this many new leak cards a day (inside the 10 new)
alt_min_games = 5           # Openings screen: a better-scoring alternative needs this many games
trend_min_games = 60        # rating-adjusted score over time for groups with this many games
trend_block = 30            # ... in blocks of this many games

[insights]
timezone = "America/New_York"
session_gap_min = 15

[progress]                  # the Progress section of the Openings screen
training_start = "2026-11-14"   # games from this date on (local time) count as "since"
min_games_since = 10        # fewer games since the start: "not enough games yet" (raw counts still shown)
min_games_rating = 30       # performance rating per site and format needs this many games since the start (about +/-125 points)
